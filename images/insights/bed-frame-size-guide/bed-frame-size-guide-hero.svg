<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Global bed frame sizing guide</title>
  <desc id="desc">Technical top-view line drawing of a platform bed frame with width and length arrows and US, UK and EU market labels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#e9edf0"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#667786" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#223b52"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#24384a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M80 98H1520M80 802H1520" stroke="#223b52" stroke-opacity=".18"/>
  <path d="M98 80V820M1502 80V820" stroke="#223b52" stroke-opacity=".18"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="110" y="155" fill="#223b52" font-size="26" font-weight="700" letter-spacing="4">BED FRAME SIZING REFERENCE</text>
    <text x="110" y="200" fill="#5b6c79" font-size="21">Market name + exact dimensions + approved product specification</text>
  </g>

  <g transform="translate(388 222)" filter="url(#shadow)">
    <rect x="0" y="0" width="824" height="490" rx="32" fill="#fdfcf8" stroke="#223b52" stroke-width="10"/>
    <rect x="54" y="58" width="716" height="372" rx="20" fill="#eef1eb" stroke="#667786" stroke-width="4" stroke-dasharray="13 10"/>
    <rect x="90" y="92" width="644" height="300" rx="12" fill="#ffffff" stroke="#4e7767" stroke-width="5"/>
    <path d="M90 160H734M90 228H734M90 296H734" stroke="#667786" stroke-width="4" stroke-opacity=".65"/>
    <circle cx="25" cy="25" r="8" fill="#4e7767"/>
    <circle cx="799" cy="25" r="8" fill="#4e7767"/>
    <circle cx="25" cy="465" r="8" fill="#4e7767"/>
    <circle cx="799" cy="465" r="8" fill="#4e7767"/>
  </g>

  <g fill="none" stroke="#223b52" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M388 766H1212"/>
    <path d="M355 222V712"/>
  </g>
  <g fill="#223b52" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2">
    <text x="745" y="812">WIDTH</text>
    <text x="330" y="495" text-anchor="middle" transform="rotate(-90 330 495)">LENGTH</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
    <g transform="translate(1260 314)">
      <rect width="190" height="68" rx="34" fill="#223b52"/>
      <text x="95" y="44" fill="#fff" text-anchor="middle">US</text>
    </g>
    <g transform="translate(1260 414)">
      <rect width="190" height="68" rx="34" fill="#667786"/>
      <text x="95" y="44" fill="#fff" text-anchor="middle">UK</text>
    </g>
    <g transform="translate(1260 514)">
      <rect width="190" height="68" rx="34" fill="#4e7767"/>
      <text x="95" y="44" fill="#fff" text-anchor="middle">EU</text>
    </g>
  </g>

  <g transform="translate(75 330)" font-family="Arial, Helvetica, sans-serif">
    <circle cx="18" cy="18" r="18" fill="#4e7767"/>
    <text x="18" y="25" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <text x="52" y="12" fill="#223b52" font-size="18" font-weight="700">MARKET LABEL</text>
    <text x="52" y="40" fill="#5b6c79" font-size="17">For communication</text>

    <circle cx="18" cy="128" r="18" fill="#4e7767"/>
    <text x="18" y="135" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <text x="52" y="122" fill="#223b52" font-size="18" font-weight="700">EXACT SIZE</text>
    <text x="52" y="150" fill="#5b6c79" font-size="17">For development</text>

    <circle cx="18" cy="238" r="18" fill="#4e7767"/>
    <text x="18" y="245" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <text x="52" y="232" fill="#223b52" font-size="18" font-weight="700">APPROVED DRAWING</text>
    <text x="52" y="260" fill="#5b6c79" font-size="17">For production</text>
  </g>
</svg>
